# Producción (Openship). No es el loop local: `bun run dev:all` sigue
# usando Postgres nativo. Este archivo solo lo consume el VPS.
#
# Secretos: el panel de Openship (Environment de cada servicio) los inyecta.
# Sin depends_on: Openship se queda eterno si postgres aún no arranca.
# La API reintenta Postgres sola. Web habla con la API por HTTPS público
# (NEXT_PUBLIC_API_URL), no por Docker.
name: misupertostada

services:
  postgres:
    image: postgres:17-alpine
    platform: linux/amd64
    restart: unless-stopped
    hostname: postgres
    environment:
      POSTGRES_USER: tostada
      POSTGRES_DB: misupertostada
    volumes:
      - pgdata17:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=1GB
      - -c
      - max_connections=50
      - -c
      - listen_addresses=*
    mem_limit: 1024m
    cpus: "1.0"
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tostada -d misupertostada"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      POSTGRES_USER: tostada
      POSTGRES_DB: misupertostada
      POSTGRES_HOST: postgres
      API_PORT: "3001"
      WEB_ORIGIN: https://pedidos.misupertostada.com
      SESSION_COOKIE_NAME: session
      SESSION_TTL_SECONDS: "604800"
      BOOTSTRAP_ADMIN_USERNAME: cristian
      SEED_ON_BOOT: "true"
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    mem_limit: 1024m
    cpus: "1.5"
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.5"

  web:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    mem_limit: 640m
    cpus: "1.0"
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: "1.0"

volumes:
  pgdata17:
